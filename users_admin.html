<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/solaris-illustration.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/style_users.css">
    <title>Usuarios - Solaris</title>
</head>
<body>

    <header>
        <nav>
            <a class="logo" href="dashboard_admin.html"><img src="images/solaris-logo.svg" alt="Solaris"></a>
            <button class="nav-toggle" type="button">
                <img src="images/menu-icon.svg" alt="Menú">
            </button>
            <ul>
                <li><a href="dashboard_admin.html">Inicio</a></li>
                <li><a href="users_admin.html" class="active">Usuarios</a></li>
                <li><a href="notes_admin.html">Notas</a></li>
                <li><a href="attendance_admin.html">Asistencias</a></li>
                <li><a href="contact_admin.html">Contacto</a></li>
            </ul>
            <div class="nav-auth">
                <a href="index.html" class="btn btn-secondary" id="btnLogout">Cerrar Sesión</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1>Panel de Usuarios</h1>
        </div>

        <form class="controls" id="formInline">
            <input type="hidden" id="editIndex">
            <input class="form-field" type="text" id="name" placeholder="Nombre" required>
            <input class="form-field" type="text" inputmode="numeric" id="doc" pattern="[0-9]{10}" maxlength="10" placeholder="Documento" required>
            <input class="form-field" type="password" id="pass" placeholder="Contraseña" minlength="8" maxlength="20" required>
            <select class="form-field" id="role">
                <option value="student">Estudiante</option>
                <option value="teacher">Docente</option>
                <option value="admin">Administrador</option>
            </select>
            <button type="submit" class="btn btn-primary" id="btnSubmit">Agregar</button>
            <button type="button" class="btn btn-secondary" id="btnCancel" style="display:none">Cancelar</button>
        </form>

        <div class="table">
            <table>
                <thead>
                    <tr>
                        <th>NOMBRE</th>
                        <th>DOCUMENTO</th>
                        <th>ROL</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
    </main>
</body>
<script src="scripts/main.js"></script>
<script src="scripts/crud.js"></script>
</html>
